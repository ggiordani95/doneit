[project]
name = "swarm-contracts"
version = "0.1.0"
description = "Pydantic contracts for tasks, results, events and integration events"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "swarm-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_contracts"]

[tool.uv.sources]
swarm-shared = { workspace = true }
