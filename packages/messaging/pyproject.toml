[project]
name = "swarm-messaging"
version = "0.1.0"
description = "MessageBus protocol and Redpanda (Kafka-protocol) adapter"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12",
    "pydantic>=2.9",
    "swarm-contracts",
    "swarm-observability",
    "swarm-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_messaging"]

[tool.uv.sources]
swarm-shared = { workspace = true }
swarm-contracts = { workspace = true }
swarm-observability = { workspace = true }
