[project]
name = "swarm-observability"
version = "0.1.0"
description = "Structured logging, tracing and metrics setup"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.4",
    "swarm-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_observability"]

[tool.uv.sources]
swarm-shared = { workspace = true }
