[project]
name = "swarm-shared"
version = "0.1.0"
description = "Settings, IDs, errors and time helpers shared across the swarm"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_shared"]
