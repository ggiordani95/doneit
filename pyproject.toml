[project]
name = "swarm"
version = "0.1.0"
description = "AI Agent Swarm — distributed multi-agent execution platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "swarm-shared",
    "swarm-contracts",
    "swarm-observability",
    "swarm-messaging",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[redpanda,postgres]>=4.9",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
swarm-shared = { workspace = true }
swarm-contracts = { workspace = true }
swarm-observability = { workspace = true }
swarm-messaging = { workspace = true }
swarm-database = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "apps/*/src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "PT",       # pytest style
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "A003",     # class attribute shadowing a builtin (Pydantic fields like `input`)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/shared/src:packages/contracts/src:packages/observability/src:packages/messaging/src:packages/database/src"

[[tool.mypy.overrides]]
module = ["aiokafka.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires docker containers (deselect with '-m \"not integration\"')",
]
